name: auth-services

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: 'secondversionoflearningregistry'
      IMAGE_NAME: 'authservices'
      APP_NAME: 'authservicesapp'
      RESOURCE_GROUP: 'secondgroup'

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to azure
        uses: azure/login@v2
        with: 
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: login to acr
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: build and tag
        run: docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .

      - name: push the image
        run: docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: update the app if present else create a new one
        run: |
          az extension add --name containerapp --upgrade
          az containerapp up \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment "authserver-env" \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            --target-port 8080 \
            --ingress external
